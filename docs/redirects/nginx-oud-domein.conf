# Oude domein thewineandfoodacademy.com -> italianwineandfoodacademy.com (301)
# Plaats dit in de server-blok van het OUDE domein, boven de WordPress-regels.
# 1) Wat moet blijven (leeromgeving, betalen, WordPress zelf) valt hier buiten.
# 2) Bekende oude adressen gaan naar hun nieuwe plek.
# 3) De rest gaat naar hetzelfde pad op het nieuwe domein.

